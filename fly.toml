# Fly.io: optional self-hosting of the Aether server + studio container.
# The public copy of the studio is the static site (vercel.json); see
# docs/DEPLOYMENT.md before exposing a server to the internet.
#
#   fly launch --no-deploy --copy-config     # pick your own app name
#   fly volumes create aether_data --size 1
#   fly deploy
#
# Keep one machine running at all times (no cold starts for visitors).

app = "aether-studio"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  # Fly's edge proxy is exactly one hop: trust its X-Forwarded-For entry for rate limiting.
  TRUST_PROXY_HOPS = "1"
  LOG_LEVEL = "info"
  AETHER_DAILY_TOKEN_BUDGET = "2000000"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "aether_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
